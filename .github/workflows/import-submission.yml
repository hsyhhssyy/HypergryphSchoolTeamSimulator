name: Import question submission

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: submission-issue-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  import:
    if: github.event.issue.state == 'open' && (contains(github.event.issue.labels.*.name, '题目投稿') || startsWith(github.event.issue.title, '[题目投稿]'))
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      BRANCH_NAME: submission/issue-${{ github.event.issue.number }}
    steps:
      - name: Publish processing placeholder
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- submission-preview -->';
            const body = `${marker}
            # 投稿处理中

            ⏳ 已收到投稿，正在下载并校验 ZIP。后续的标注图、原图和审核状态都会持续更新在本评论中。

            当前状态：🔵 正在处理`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download, validate and render submission
        run: node --experimental-strip-types scripts/import-submission-issue.ts
      - run: npm run questions:check
      - run: npm test
      - run: npm run build
      - name: Commit submission branch
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "${BRANCH_NAME}"
          git add "public/questions/items/submission-${ISSUE_NUMBER}-"* ".github/submission-previews/issue-${ISSUE_NUMBER}"
          git commit -m "Add submission from issue #${ISSUE_NUMBER}"
          git fetch origin "refs/heads/${BRANCH_NAME}:refs/remotes/origin/${BRANCH_NAME}" || true
          git push --force-with-lease origin "HEAD:refs/heads/${BRANCH_NAME}"
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
      - name: Create or find pull request
        id: pull
        shell: bash
        run: |
          set -euo pipefail
          pull_number="$(gh pr list --head "${BRANCH_NAME}" --state open --json number --jq '.[0].number // empty')"
          if [[ -z "${pull_number}" ]]; then
            body="$(printf 'Closes #%s.\n\n## 审核操作\n\n- **审核通过**：点击 Merge pull request。题目将被收录，Issue #%s 会自动关闭并显示发布版本。\n- **审核拒绝**：点击 Close pull request，不要合并。Issue #%s 会标记为“审核未通过”并自动关闭。\n- 标注图、投稿原图和答案坐标请在 Issue #%s 中审核。\n- 请不要只关闭 Issue；题目是否收录以本 PR 的合并状态为准。' "${ISSUE_NUMBER}" "${ISSUE_NUMBER}" "${ISSUE_NUMBER}" "${ISSUE_NUMBER}")"
            pull_url="$(gh pr create --head "${BRANCH_NAME}" --title "[题目投稿 #${ISSUE_NUMBER}] ${ISSUE_TITLE}" --body "${body}")"
            pull_number="${pull_url##*/}"
          fi
          echo "number=${pull_number}" >> "${GITHUB_OUTPUT}"
      - name: Publish preview in issue
        run: node --experimental-strip-types scripts/publish-submission-preview.ts "${ISSUE_NUMBER}" "${{ steps.pull.outputs.number }}" "${{ steps.commit.outputs.sha }}"
      - name: Mark issue as awaiting review
        shell: bash
        run: |
          gh label create "等待审核" --color "FBCA04" --description "投稿已生成预览，等待维护者审核" --force
          gh issue edit "${ISSUE_NUMBER}" --add-label "等待审核"
      - name: Report processing failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- submission-preview -->';
            const body = `${marker}
            # 投稿处理失败

            ❌ 投稿包自动处理失败。请检查 ZIP 是否由最新投稿工具生成，并查看 [本次运行日志](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})。

            修改 Issue 后会自动重试，并继续更新本评论。

            当前状态：🔴 处理失败`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
